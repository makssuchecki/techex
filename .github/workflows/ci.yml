name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zaloguj do ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zbuduj i opublikuj obraz
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Uruchom klaster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster

      - name: Załaduj obraz do kind
        run: |
          docker pull ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

          kind load docker-image \
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            --name test-cluster

      - name: Wdróż system
        run: |
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/backend/

          kubectl set image deployment/backend-green \
            backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Poczekaj na deploymenty
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/backend-green --timeout=180s

      - name: Diagnostyka
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc

      - name: Poczekaj na Ready
        run: |
          kubectl wait \
            --for=condition=Ready pod \
            -l app=backend \
            --timeout=180s

      - name: Test HTTP
        run: |
          kubectl port-forward service/backend 8080:80 >/tmp/pf.log 2>&1 &
          sleep 15

          curl --fail http://localhost:8080/health
